<style>
/* Layout: one-column phone-first study app — home grid of subject tiles, each subject opens behind its own coloured divider band */
:root{
  --bg:#EEF5F2; --surface:#FFFFFF; --surface-2:#F5F9F7; --ink:#17322B; --muted:#5B7169; --line:#D5E3DD;
  --brand:#0F6B57; --sun:#F4B740; --good:#1E9E5A; --good-bg:#E3F6EA; --bad:#D64545; --bad-bg:#FCE8E8;
  --c-aqidah:#6A4BC2; --c-sirah:#C77612; --c-ibadah:#0E8A7B; --c-adab:#C8466F; --c-jawi:#2B66CF; --c-arab:#3F8A22;
  --t-aqidah:#EFEAFB; --t-sirah:#FBF0DF; --t-ibadah:#DFF4F1; --t-adab:#FBE6ED; --t-jawi:#E3ECFB; --t-arab:#E6F3DE;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Amiri","Traditional Arabic","Geeza Pro",serif;
  --radius:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A17; --surface:#172622; --surface-2:#1D2F2A; --ink:#E5F1EC; --muted:#9BB3AA; --line:#2B403A;
  --brand:#5BC9AC; --sun:#F4C35E; --good:#4CCB85; --good-bg:#183A28; --bad:#F07A7A; --bad-bg:#3C1E1E;
  --c-aqidah:#A88CF2; --c-sirah:#F0A848; --c-ibadah:#3FC7B4; --c-adab:#F07FA2; --c-jawi:#78A4F5; --c-arab:#88C766;
  --t-aqidah:#251E3B; --t-sirah:#33261A; --t-ibadah:#14302C; --t-adab:#35202A; --t-jawi:#1A2742; --t-arab:#1E2F18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#172622; --surface-2:#1D2F2A; --ink:#E5F1EC; --muted:#9BB3AA; --line:#2B403A;
  --brand:#5BC9AC; --sun:#F4C35E; --good:#4CCB85; --good-bg:#183A28; --bad:#F07A7A; --bad-bg:#3C1E1E;
  --c-aqidah:#A88CF2; --c-sirah:#F0A848; --c-ibadah:#3FC7B4; --c-adab:#F07FA2; --c-jawi:#78A4F5; --c-arab:#88C766;
  --t-aqidah:#251E3B; --t-sirah:#33261A; --t-ibadah:#14302C; --t-adab:#35202A; --t-jawi:#1A2742; --t-arab:#1E2F18;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.9}

/* Hero */
.hero{background:var(--brand);color:#fff;border-radius:24px;padding:22px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sun) 0 38%,transparent 39%);opacity:.9}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:800;position:relative;z-index:1;max-width:80%}
.hero p{margin:6px 0 0;position:relative;z-index:1;font-weight:700;opacity:.95}
.doa{margin-top:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:14px;position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.doa .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;opacity:.85}
.doa .ar{font-size:26px;text-align:center}
.doa .mean{font-size:14px;text-align:center;opacity:.95}
.snd{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;background:var(--sun);color:#3A2600}
.doa .snd{align-self:center}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* Subject grid */
.sec-title{font-size:22px;font-weight:800;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-title small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border:0;text-align:left;background:var(--tint);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px;border-bottom:5px solid var(--col);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .em{font-size:38px;line-height:1}
.tile .nm{font-family:var(--f-display);font-weight:800;font-size:21px;color:var(--col)}
.tile .jw{font-family:var(--f-ar);font-size:18px;direction:rtl;text-align:left;color:var(--ink)}
.tile .pg{font-size:13px;color:var(--muted);font-weight:700}
.stars{color:var(--sun);letter-spacing:1px}
.stars .off{color:var(--line)}

/* Divider band */
.divider{background:var(--col);color:#fff;border-radius:24px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.divider .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.divider .no{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.9}
.divider .row{display:flex;align-items:center;gap:14px}
.divider .em{font-size:52px;line-height:1;background:rgba(255,255,255,.18);border-radius:18px;padding:8px}
.divider h2{font-size:clamp(30px,8vw,44px);font-weight:800}
.divider .jw{font-family:var(--f-ar);font-size:24px;direction:rtl}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .divider{color:#0F1A17}:root:not([data-theme="light"]) .back{color:#0F1A17}}
:root[data-theme="dark"] .divider,:root[data-theme="dark"] .back{color:#0F1A17}

.tabs{display:flex;gap:8px;background:var(--surface);padding:6px;border-radius:999px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:999px;padding:10px;font-weight:800;background:transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--col);color:var(--surface)}

/* Notes */
.note{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.note-h{display:flex;gap:12px;align-items:center;padding:14px;background:var(--tint)}
.note-h .pic{font-size:44px;line-height:1;flex:none;width:64px;height:64px;display:grid;place-items:center;background:var(--surface);border-radius:16px}
.note-h .tt{min-width:0;flex:1}
.note-h h3{font-size:20px;font-weight:800;color:var(--col)}
.note-h .jw{font-family:var(--f-ar);direction:rtl;font-size:17px;text-align:left;color:var(--ink)}
.note-b{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note-b ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note-b li::marker{color:var(--col)}
.tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th{background:var(--col);color:var(--surface);text-align:left;padding:8px 10px;font-weight:800}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--surface-2)}
.arlist{display:flex;flex-direction:column;gap:8px}
.aritem{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:8px 10px}
.aritem .txt{flex:1;min-width:0}
.aritem .ar{font-size:22px;display:block}
.aritem .mn{font-size:13px;color:var(--muted)}
.mini{border:0;background:var(--tint);color:var(--col);border-radius:999px;width:40px;height:40px;flex:none;font-size:18px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.vc{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.vc:hover,.vc.on{border-color:var(--col)}
.vc .pic{font-size:36px;line-height:1.1}
.vc .ar{font-size:22px;line-height:1.6}
.vc .mn{font-size:13px;font-weight:700;color:var(--muted)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.lt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center}
.lt .ar{font-size:30px;line-height:1.5}
.lt small{font-weight:800;color:var(--col)}
.hintbox{background:var(--tint);border:2px dashed var(--col);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:700;line-height:1.7}
.hintbox .ar{font-size:20px}
.tip{background:var(--tint);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}

/* Practice */
.fmt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.fmt b{color:var(--col)}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.setc{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.setc:hover{border-color:var(--col)}
.setc .n{font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--col)}
.setc .s{font-size:13px;color:var(--muted);font-weight:700}

.quiz{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:var(--tint);color:var(--col);font-weight:800;font-size:13px;border-radius:999px;padding:4px 12px}
.qn{font-weight:800;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--col);border-radius:999px;transition:width .3s}
.qtext{font-size:20px;font-weight:800;line-height:1.5}
.qtext .ar{font-size:26px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1;justify-content:center}
.opt{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:700;font-size:17px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--col);font-weight:800}
.opt .v{min-width:0;flex:1}
.opt .v.ar{font-size:24px;text-align:right}
.opt:hover:not(:disabled){border-color:var(--col)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:14px;padding:12px 14px;font-weight:800}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .ar{font-size:22px}
.act{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:800;background:var(--col);color:var(--surface);font-size:16px}
.btn.ghost{background:var(--tint);color:var(--col)}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .big{font-family:var(--f-display);font-size:56px;font-weight:800;color:var(--col);line-height:1;font-variant-numeric:tabular-nums}
.result .stars{font-size:40px}
.review{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.rv{border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:14px}
.rv.no{background:var(--bad-bg)}
.rv .ar{font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;max-width:90vw;text-align:center;z-index:20}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){.tile,.bar i{transition:none}}

{id:"sirah",name:"Sirah",jw:"سيره",em:"🐫",
 notes:[
  {t:"Nabi Muhammad s.a.w. digelar Al-Amin",jw:"منرڠکن ڤريستيوا منداڤت ݢلرن الأمين",img:"🤝",
   p:["Al-Amin bermaksud orang yang dipercayai (amanah).","Gelaran ini diberi oleh penduduk Mekah (kaum Quraisy) sebelum baginda menjadi rasul.","Sebabnya: baginda sentiasa bercakap benar, jujur dan menjaga barang yang diamanahkan.","Penduduk Mekah suka menyimpan barang berharga mereka dengan Nabi."]},
  {t:"Peristiwa Meletakkan Hajarul Aswad",jw:"مڠتاهوي ڤريستيوا ڤلتقن الحجر الأسود",img:"🕋",
   p:["Hajarul Aswad ialah batu hitam di Kaabah.","Klika itu Nabi berumur 35 tahun."],
   tb:[["Langkah","Apa yang berlaku"],["1","Kaabah rosak akibat banjir, lalu dibaiki semula oleh kaum Quraisy."],["2","Ketua-ketua kabilah berebut untuk meletakkan Hajarul Aswad. Hampir bergaduh."],["3","Mereka setuju: orang pertama yang masuk ke Masjidil Haram akan menjadi hakim."],["4","Orang pertama yang masuk ialah Nabi Muhammad s.a.w. Semua gembira."],["5","Nabi menghamparkan kain dan meletakkan batu di tengahnya."],["6","Setiap ketua kabilah memegang hujung kain dan mengangkatnya bersama-sama."],["7","Nabi meletakkan Hajarul Aswad di tempatnya. Semua berpuas hati."]]},
  {t:"Nabi Menggembala Kambing",jw:"منچريتاکن نبي محمد ﷺ مڠمبالا کمبيڠ",img:"🐐",
   p:["Semasa kecil, Nabi Muhammad s.a.w. menggembala kambing milik penduduk Mekah dan mendapat upah.","Baginda menjaga kambing dengan baik supaya tidak hilang dan cukup makan.","Pengajaran: sabar, bertanggungjawab, rajin bekerja dan tidak bergantung kepada orang lain."]},
  {t:"Nabi Berniaga di Syam",jw:"مڠتاهوي نبي محمد ﷺ برنياݢ دشام",img:"🐪",
   p:["Umur 12 tahun: Nabi mengikut bapa saudaranya, Abu Talib, berniaga ke Syam.","Di Busra, pendeta Bahira melihat tanda-tanda kenabian pada baginda.","Umur 25 tahun: Nabi membawa barang dagangan milik Siti Khadijah ke Syam, ditemani Maisarah.","Nabi berniaga dengan jujur dan mendapat untung yang banyak.","Siti Khadijah tertarik dengan kejujuran Nabi, lalu berkahwin dengan baginda.","Pengajaran: jujur ketika berjual beli."]},
  {t:"Sifat Wajib Nabi Muhammad s.a.w.",jw:"صيفت واجب نبي محمد ﷺ",img:"🌟",
   p:["Sifat wajib bagi Rasul ada 4. Kita mesti mencontohinya."],
   tb:[["Sifat Wajib","Maksud","Lawan (Mustahil)","Contoh untuk kita"],["1. Siddiq","Benar","Kizib (dusta)","Bercakap benar"],["2. Amanah","Dipercayai","Khianat","Pulangkan barang yang dipinjam"],["3. Tabligh","Menyampaikan","Kitman (menyembunyikan)","Sampaikan pesanan guru kepada ibu bapa"],["4. Fatanah","Bijaksana","Baladah (bodoh)","Rajin belajar, selesaikan masalah dengan bijak"]]}

{id:"ibadah",name:"Ibadah",jw:"عبادة",em:"🤲",
 notes:[
  {t:"Bersuci daripada Najis",jw:"برسوچي درڤد نجيس",img:"🧼",
   p:["Najis ialah benda kotor yang menghalang sahnya solat.","Contoh najis: darah, nanah, muntah, air kencing, tahi, bangkai, anjing dan babi.","Kita mesti membersihkan badan, pakaian dan tempat solat daripada najis.","Air yang digunakan mestilah air mutlak (air bersih yang suci dan menyucikan)."]},
  {t:"Jenis-jenis Najis dan Cara Menyucikan",jw:"جنيس٢ نجيس",img:"🚿",
   p:["Najis ada 3 jenis."],
   tb:[["Jenis","Maksud","Contoh","Cara menyucikan"],["Mughallazah","Najis berat","Anjing dan babi","Sertu: basuh 7 kali, salah satunya dengan air bercampur tanah"],["Mukhaffafah","Najis ringan","Air kencing bayi lelaki bawah 2 tahun yang minum susu ibu sahaja","Renjis air pada tempat najis"],["Mutawassitah","Najis pertengahan","Darah, nanah, muntah, tahi, air kencing","Basuh dengan air hingga hilang warna, bau dan rasa"]]},
  {t:"Bahagian Najis",jw:"بهاݢين نجيس",img:"🔍",
   p:["Najis Mutawassitah ada 2 bahagian."],
   tb:[["Bahagian","Ciri-ciri","Cara menyucikan"],["Najis 'Ainiyah","Dapat dilihat, ada warna, bau atau rasa","Buang najis, basuh hingga hilang warna, bau dan rasa"],["Najis Hukmiyah","Tidak dapat dilihat, tiada warna, bau dan rasa (contoh: air kencing yang sudah kering)","Alirkan air pada tempat najis"]]},
  {t:"Istinjak",jw:"استنجاء",img:"🚽",
   p:["Istinjak ialah membersihkan najis yang keluar dari qubul dan dubur.","Alat yang paling baik ialah air. Jika tiada air, boleh guna batu atau tisu sekurang-kurangnya 3 kali sapuan.","Gunakan tangan kiri.","Masuk tandas dengan kaki kiri dan baca doa. Keluar dengan kaki kanan dan baca doa.","Jangan bercakap di dalam tandas."],
   ar:[["اَللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ","Doa masuk tandas: Ya Allah, aku berlindung dengan-Mu daripada syaitan lelaki dan perempuan."],["غُفْرَانَكَ","Doa keluar tandas: Aku memohon keampunan-Mu."]]},
  {t:"Azan dan Iqamah",jw:"اذان دان اقامة",img:"📢",
   p:["Azan ialah seruan untuk memberitahu masuk waktu solat fardu.","Orang yang melaungkan azan dipanggil bilal atau muazzin. Muazzin pertama ialah Bilal bin Rabah.","Iqamah ialah seruan menandakan solat akan didirikan.","Azan Subuh ada tambahan: اَلصَّلَاةُ خَيْرٌ مِنَ النَّوْمِ (2 kali).","Iqamah ada lafaz khas: قَدْ قَامَتِ الصَّلَاةُ (2 kali)."],
   ar:[["اَللّٰهُ أَكْبَرُ","Allah Maha Besar (azan 4 kali, iqamah 2 kali)"],["أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ","Aku bersaksi tiada Tuhan melainkan Allah"],["أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللّٰهِ","Aku bersaksi Nabi Muhammad pesuruh Allah"],["حَيَّ عَلَى الصَّلَاةِ","Marilah menunaikan solat"],["حَيَّ عَلَى الْفَلَاحِ","Marilah menuju kejayaan"],["قَدْ قَامَتِ الصَّلَاةُ","Solat telah didirikan (iqamah sahaja)"],["لَا إِلٰهَ إِلَّا اللّٰهُ","Tiada Tuhan melainkan Allah"]]},
  {t:"Menjawab Azan dan Iqamah",jw:"جواب اذان دان اقامة",img:"👂",
   p:["Apabila mendengar azan, kita diam dan mengikut lafaz yang sama.","Ada beberapa lafaz yang jawapannya berbeza:"],
   tb:[["Muazzin menyebut","Kita menjawab"],["حَيَّ عَلَى الصَّلَاةِ / حَيَّ عَلَى الْفَلَاحِ","لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ"],["اَلصَّلَاةُ خَيْرٌ مِنَ النَّوْمِ","صَدَقْتَ وَبَرِرْتَ"],["قَدْ قَامَتِ الصَّلَاةُ","أَقَامَهَا اللّٰهُ وَأَدَامَهَا"]],
   ar:[["لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ","Tiada daya dan kekuatan melainkan dengan Allah"],["صَدَقْتَ وَبَرِرْتَ","Benarlah engkau dan baiklah engkau"],["أَقَامَهَا اللّٰهُ وَأَدَامَهَا","Semoga Allah mendirikannya dan mengekalkannya"]]},
  {t:"Bacaan dalam Solat",jw:"باچاءن دالم صلاة",img:"🧎",
   p:["Solat dimulakan dengan takbiratul ihram dan diakhiri dengan salam.","Surah Al-Fatihah wajib dibaca dalam setiap rakaat."],
   ar:[["اَللّٰهُ أَكْبَرُ","Takbiratul ihram"],["إِنِّي وَجَّهْتُ وَجْهِيَ…","Doa iftitah (selepas takbiratul ihram)"],["سُبْحَانَ رَبِّيَ الْعَظِيمِ","Klika rukuk (3 kali)"],["سَمِعَ اللّٰهُ لِمَنْ حَمِدَهُ","Klika bangun dari rukuk (iktidal)"],["رَبَّنَا لَكَ الْحَمْدُ","Klika berdiri iktidal"],["سُبْحَانَ رَبِّيَ الْأَعْلَى","Klika sujud (3 kali)"],["رَبِّ اغْفِرْ لِي وَارْحَمْنِي…","Duduk antara dua sujud"],["اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ","Memberi salam"]]}

{id:"adab",name:"Adab",jw:"اداب",em:"🌸",
 notes:[
  {t:"Adab Makan dan Minum",jw:"اداب ماکن دان مينوم",img:"🍽️",
   p:["Basuh tangan sebelum dan selepas makan.","Baca doa sebelum makan.","Makan dan minum dengan tangan kanan, sambil duduk.","Ambil makanan yang paling dekat dengan kita.","Jangan mencela makanan, jangan meniup makanan panas, jangan membazir.","Minum perlahan-lahan dengan tiga teguk dan jangan bernafas dalam cawan.","Baca doa selepas makan dan bersyukur kepada Allah."],
   ar:[["اَللّٰهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ","Doa sebelum makan: Ya Allah, berkatilah rezeki kami dan peliharalah kami daripada azab neraka."],["بِسْمِ اللّٰهِ أَوَّلَهُ وَآخِرَهُ","Jika terlupa membaca doa di awal makan"],["اَلْحَمْدُ لِلّٰهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ","Doa selepas makan: Segala puji bagi Allah yang memberi kami makan dan minum serta menjadikan kami orang Islam."]]},
  {t:"Adab Masuk dan Keluar Rumah",jw:"اداب ماسوق دان کلوار رومه",img:"🏠",
   p:["Masuk rumah dengan kaki kanan, beri salam dan baca doa.","Tanggalkan kasut dan susun dengan kemas.","Minta izin ibu bapa sebelum keluar rumah.","Keluar rumah dengan kaki kiri dan baca doa keluar rumah.","Jika ke rumah orang lain, beri salam dan minta izin sebanyak 3 kali."],
   ar:[["اَلسَّلَامُ عَلَيْكُمْ","Memberi salam"],["وَعَلَيْكُمُ السَّلَامُ","Menjawab salam"],["بِسْمِ اللّٰهِ تَوَكَّلْتُ عَلَى اللّٰهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ","Doa keluar rumah: Dengan nama Allah, aku bertawakal kepada Allah. Tiada daya dan kekuatan melainkan dengan Allah."]]},
  {t:"Adab Menaiki Kenderaan",jw:"اداب منايقي کندراءن",img:"🚌",
   p:["Baca doa naik kenderaan.","Naik kenderaan dengan kaki kanan.","Pakai tali pinggang keledar di dalam kereta, topi keledar di atas motosikal.","Duduk dengan sopan dan jangan membuat bising.","Jangan keluarkan tangan atau kepala dari tingkap.","Beratur ketika menunggu bas dan beri tempat duduk kepada orang tua.","Simpan sampah dan buang ke dalam tong sampah."],
   ar:[["سُبْحَانَ الَّذِي سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنْقَلِبُونَ","Doa naik kenderaan: Maha Suci Allah yang memudahkan kenderaan ini untuk kami."]]},
  {t:"Adab Berpakaian",jw:"اداب برڤاکاين",img:"👗",
   p:["Pakaian mestilah menutup aurat, bersih dan kemas.","Aurat lelaki: antara pusat dan lutut. Aurat perempuan: seluruh badan kecuali muka dan dua tapak tangan.","Mula memakai pakaian dengan anggota kanan. Tanggalkan dengan anggota kiri.","Baca doa ketika memakai pakaian.","Lelaki tidak boleh memakai pakaian perempuan, dan sebaliknya.","Lelaki tidak boleh memakai emas dan sutera."],

(function(){

const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const U=a=>[...new Set(a)];
const ds=(pool,ans,n)=>sh(U(pool).filter(x=>x!==ans)).slice(0,n);
const pk=a=>a[Math.floor(rnd()*a.length)];
const P={};SUBJECTS.forEach(s=>{P[s.id]={A:[],B:[],C:[]};s.sets.flat().forEach(q=>{(q.length===5?P[s.id].A:q.length===2?P[s.id].B:P[s.id].C).push(q)})});
const A=(id,q,ans,pool)=>{const d=ds(pool,ans,3);if(d.length===3)P[id].A.push([q,ans,...d])};

const C=(id,q,ans,pool)=>{const d=ds(pool,ans,2);if(d.length===2)P[id].C.push([q,ans,...d])};
const CX=(id,q,ans,d)=>P[id].C.push([q,ans,...d]);
const cap=s=>s[0].toUpperCase()+s.slice(1);

/* ---- AQIDAH ---- */
const SW=[["Wujud","Ada","'Adam","tiada"],["Qidam","Sedia, tiada permulaan","Huduth","baharu"],["Baqa'","Kekal, tiada kesudahan","Fana'","binasa"]];
const SWN=SW.map(x=>x[0]).concat(["Qudrat","Sama'","Basar"]),SWM=SW.map(x=>x[1]).concat(["Mendengar","Melihat","Berkuasa"]),SWL=SW.map(x=>`${x[2]} (${x[3]})`).concat(["Kizib (dusta)"]);
SW.forEach(([n,m,l,lm],i)=>{
 A("aqidah",`Sifat ${n} bermaksud…`,m,SWM);A("aqidah",`Sifat wajib bagi Allah yang bermaksud ‘${m}’ ialah…`,n,SWN);
 A("aqidah",`Lawan (sifat mustahil) bagi sifat ${n} ialah…`,`${l} (${lm})`,SWL);A("aqidah",`Sifat mustahil ${l} (${lm}) ialah lawan bagi sifat…`,n,SWN);
 A("aqidah",`Sifat wajib bagi Allah yang ke-${i+1} ialah…`,n,SWN);
 B2("aqidah",x=>`Sifat ${n} bermaksud ${x.toLowerCase()}.`,m,SW.map(y=>y[1]));B2("aqidah",x=>`Lawan bagi sifat ${n} ialah ${x}.`,l,SW.map(y=>y[2]));
 C("aqidah",`Allah bersifat ___ iaitu ${m.toLowerCase()}.`,n,SW.map(y=>y[0]));C("aqidah",`Lawan bagi sifat ${n} ialah ___.`,l,SW.map(y=>y[2]));
 C("aqidah",`Sifat ${n} bermaksud ___.`,m.split(",")[0],SW.map(y=>y[1].split(",")[0]));
});
const UA=["Nabi Nuh a.s.","Nabi Ibrahim a.s.","Nabi Musa a.s.","Nabi Isa a.s.","Nabi Muhammad s.a.w."],UN=["Nabi Adam a.s.","Nabi Yusuf a.s.","Nabi Yunus a.s.","Nabi Sulaiman a.s.","Nabi Daud a.s."];
const UF=[["Nabi Nuh a.s.","membina bahtera, lalu Allah menurunkan banjir besar"],["Nabi Ibrahim a.s.","dibakar oleh Raja Namrud tetapi api menjadi sejuk"],["Nabi Ibrahim a.s.","membina Kaabah bersama anaknya Nabi Ismail a.s."],["Nabi Musa a.s.","membelah laut dengan tongkat"],["Nabi Musa a.s.","menentang Firaun yang zalim"],["Nabi Musa a.s.","menerima kitab Taurat"],["Nabi Isa a.s.","menyembuhkan orang sakit dengan izin Allah"],["Nabi Isa a.s.","menerima kitab Injil"],["Nabi Muhammad s.a.w.","rasul terakhir yang menerima kitab Al-Quran"]];
UF.forEach(([n,f])=>{A("aqidah",`Rasul Ulul Azmi yang ${f} ialah…`,n,UA);B2("aqidah",x=>`${x} ${f}.`,n,UA);C("aqidah",`___ ${f}.`,n,UA)});
UA.forEach((n,i)=>{AX("aqidah","Antara berikut, yang manakah Rasul Ulul Azmi?",n,sh(UN).slice(0,3));A("aqidah",`Rasul Ulul Azmi yang ke-${i+1} ialah…`,n,UA);B("aqidah",`${n} ialah Rasul Ulul Azmi.`,1)});
UN.forEach(n=>B("aqidah",`${n} ialah salah seorang Rasul Ulul Azmi.`,0));

UA.forEach((n,i)=>{if(i<4){A("aqidah",`Ikut kronologi sejarah, Rasul Ulul Azmi selepas ${n} ialah…`,UA[i+1],UA);CX("aqidah",`Ikut kronologi: ${n} → ___`,UA[i+1],UA.filter(x=>x!==UA[i+1]&&x!==n).slice(0,2))}if(i>0)A("aqidah",`Ikut kronologi sejarah, Rasul Ulul Azmi sebelum ${n} ialah…`,UA[i-1],UA)});

AX("aqidah","Susunan Rasul Ulul Azmi ikut kronologi sejarah yang betul ialah…","Nuh, Ibrahim, Musa, Isa, Muhammad",["Muhammad, Ibrahim, Musa, Isa, Nuh","Ibrahim, Nuh, Isa, Musa, Muhammad","Musa, Isa, Nuh, Ibrahim, Muhammad"]);

[["Ikut kronologi sejarah, Nabi Nuh a.s. ialah Rasul Ulul Azmi yang pertama.",1],["Ikut kronologi sejarah, Nabi Musa a.s. datang sebelum Nabi Ibrahim a.s.",0],["Ikut keafdalan, Nabi Muhammad s.a.w. ialah Rasul Ulul Azmi yang paling mulia.",1],["Ikut keafdalan, Nabi Ibrahim a.s. berada di tempat kedua.",1],["Nabi Isa a.s. diutus sebelum Nabi Musa a.s.",0],["Ulul Azmi bermaksud rasul yang mempunyai keazaman dan kesabaran yang tinggi.",1]].forEach(([t,v])=>B("aqidah",t,v));
[["Kitab Taurat","Nabi Musa a.s."],["Kitab Injil","Nabi Isa a.s."],["Al-Quran","Nabi Muhammad s.a.w."]].forEach(([k,n])=>{A("aqidah",`${k} diturunkan kepada…`,n,UA.concat(["Nabi Daud a.s."]));C("aqidah",`${k} diturunkan kepada ___.`,n,UA)});
const TP=[["Akar","menyerap air dari tanah"],["Batang","menegakkan pokok"],["Daun","membuat makanan dengan bantuan cahaya matahari"],["Buah","dimakan, contohnya epal dan pisang"]];
TP.forEach(([p,f])=>{A("aqidah",`Bahagian tumbuhan yang ${f} ialah…`,p.toLowerCase(),TP.map(x=>x[0].toLowerCase()).concat(["bunga"]));B2("aqidah",x=>`${cap(x)} tumbuhan ${f}.`,p.toLowerCase(),TP.map(x=>x[0].toLowerCase()));C("aqidah",`___ tumbuhan ${f}.`,p,TP.map(x=>x[0]))});
["air","cahaya matahari","udara","tanah"].forEach(n=>{AX("aqidah","Antara berikut, yang manakah keperluan tumbuhan untuk hidup?",n,sh(["gula-gula","asap kenderaan","plastik","minuman bergas"]).slice(0,3));B("aqidah",`Tumbuhan memerlukan ${n} untuk hidup.`,1)});
["makanan seperti buah dan sayur","ubat-ubatan","udara yang bersih","teduhan"].forEach(m=>{AX("aqidah","Antara manfaat tumbuhan kepada manusia ialah…",m,sh(["mencemarkan udara","menyebabkan banjir","membuat bising","menyebabkan sakit"]).slice(0,3));B("aqidah",`Tumbuhan memberi manfaat kepada manusia, contohnya ${m}.`,1)});
[["Kita mesti ___ kepada Allah atas nikmat tumbuhan.","bersyukur",["sombong","lalai"]],["Rasul Ulul Azmi sangat ___ menghadapi ujian.","sabar",["marah","malas"]],["Allah ___ tumbuh-tumbuhan untuk manusia dan haiwan.","mencipta",["membeli","menjual"]],["Daun membebaskan gas ___ untuk kita bernafas.","oksigen",["asap","karbon dioksida"]]].forEach(([q,a,d])=>CX("aqidah",q,a,d));

let actx=null;
function tone(seq){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;seq.forEach(([f,d,type])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.85})}catch(e){}}
const sfx={ok:()=>tone([[660,.12],[880,.12],[1320,.22]]),no:()=>tone([[220,.25,"triangle"],[180,.3,"triangle"]]),win:()=>tone([[523,.14],[659,.14],[784,.14],[1047,.35]]),tap:()=>tone([[900,.06]])};

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(lang){const pre=lang.split("-")[0];return voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(lang.toLowerCase()))||voices.find(v=>v.lang.toLowerCase().startsWith(pre))||(pre==="ms"?voices.find(v=>v.lang.toLowerCase().startsWith("id")):null)}
function cleanMs(t){return t.replace(/_{2,}/g," kosong ").replace(/s\.a\.w\./g,"sallallahu alaihi wasallam").replace(/a\.s\./g,"alaihissalam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/ﷺ|ﷻ/g,"").replace(/…/g,". ").replace(/★/g,"")}
function speak(text,opt){
  if(!("speechSynthesis" in window)){toast("Peranti ini tidak menyokong suara.");return}
  speechSynthesis.cancel();
  const parts=[];const forceAr=opt==="ar";
  if(forceAr){parts.push({t:text,l:"ar-SA"})}
  else{const re=/([؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿][؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿ً-ٰ\s،؟]*)/g;let last=0,m;
    while((m=re.exec(text))){if(m.index>last)parts.push({t:cleanMs(text.slice(last,m.index)),l:"ms-MY"});if(opt!=="noar")parts.push({t:m[1],l:"ar-SA"});last=m.index+m[1].length}
    if(last<text.length)parts.push({t:cleanMs(text.slice(last)),l:"ms-MY"})}
  parts.filter(p=>p.t.trim()).forEach(p=>{const u=new SpeechSynthesisUtterance(p.t);u.lang=p.l;const v=pickVoice(p.l);if(v)u.voice=v;u.rate=p.l==="ar-SA"?.8:.95;speechSynthesis.speak(u)});
}

      <button class="snd" id="doaBtn">🔊 Dengar doa</button>
    </div>
  </section>
  <div class="sec-title">Pilih subjek <small>6 subjek · 5 set · 40 soalan setiap set</small></div>
  <div class="grid">${tiles}</div>
  <div class="notice">Tajuk-tajuk ini ialah ramalan cikgu untuk peperiksaan KAFA Tahun 2. Kertas soalan sebenar disediakan oleh JAHEIK, jadi ulangkaji juga buku teks.</div>`;
  document.getElementById("doaBtn").onclick=()=>speak(DOA,"ar");
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{sfx.tap();openSubject(b.dataset.go,"nota")});
  scrollTo(0,0);
}

function divider(s){const i=SUBJECTS.indexOf(s)+1;
  return `<header class="divider"><div class="top"><span class="no">Bahagian ${i} daripada 6</span><button class="back" id="backHome">← Menu</button></div>
  <div class="row"><span class="em" aria-hidden="true">${s.em}</span><div><h2>${s.name}</h2><div class="jw">${s.jw}</div></div></div></header>`}

function openSubject(id,tab){
  const s=subj(id);
  app.innerHTML=`<div style="${colVars(s)};display:flex;flex-direction:column;gap:16px">${divider(s)}
  <div class="tabs" role="tablist"><button role="tab" id="tabN" aria-selected="${tab==="nota"}">📖 Nota</button><button role="tab" id="tabL" aria-selected="${tab!=="nota"}">✍️ Latihan</button></div>
  <div id="body" style="display:flex;flex-direction:column;gap:14px"></div></div>`;
  document.getElementById("backHome").onclick=home;
  document.getElementById("tabN").onclick=()=>openSubject(id,"nota");
  document.getElementById("tabL").onclick=()=>openSubject(id,"latihan");
  const body=document.getElementById("body");
  if(tab==="nota")renderNotes(s,body);else renderSets(s,body);
  scrollTo(0,0);
}

function renderNotes(s,body){
  body.innerHTML=s.notes.map((n,i)=>{
    let h=`<article class="note"><div class="note-h"><span class="pic" aria-hidden="true">${n.img}</span><div class="tt"><h3>${n.t}</h3><div class="jw">${n.jw}</div></div><button class="mini" data-say="${i}" aria-label="Dengar nota">🔊</button></div><div class="note-b">`;
    if(n.p)h+=`<ul>${n.p.map(x=>`<li>${wrapAr(x)}</li>`).join("")}</ul>`;
    if(n.tb)h+=`<div class="tbl"><table><thead><tr>${n.tb[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${n.tb.slice(1).map(r=>`<tr>${r.map(c=>`<td>${wrapAr(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    if(n.ar)h+=`<div class="arlist">${n.ar.map((a,j)=>`<div class="aritem"><div class="txt"><span class="ar">${a[0]}</span><span class="mn">${a[1]}</span></div><button class="mini" data-ar="${i}-${j}" aria-label="Dengar bacaan">🔊</button></div>`).join("")}</div>`;
    if(n.v)h+=`<div class="vocab">${n.v.map((v,j)=>`<button class="vc" data-v="${i}-${j}"><span class="pic" aria-hidden="true">${v[2]}</span><span class="ar">${v[0]}</span><span class="mn">${v[1]}</span></button>`).join("")}</div>`;
    if(n.g)h+=`<div class="letters">${n.g.map((g,j)=>`<button class="lt" data-g="${i}-${j}"><span class="ar">${g[0]}</span><small>${g[1]}</small></button>`).join("")}</div>`;
    if(n.w)h+=`<div class="vocab">${n.w.map((w,j)=>`<button class="vc" data-w="${i}-${j}"><span class="pic" aria-hidden="true">${w[2]}</span><span class="ar">${w[0]}</span><span class="mn">${w[1]}</span></button>`).join("")}</div>`;
    return h+`</div></article>`}).join("")+`<button class="btn" id="goL">✍️ Dah faham? Jom buat latihan!</button>`;
  body.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{const n=s.notes[b.dataset.say];let t=n.t+". "+(n.p||[]).join(". ");if(n.tb)t+=". "+n.tb.slice(1).map(r=>r.join(", ")).join(". ");speak(t,s.id==="jawi"?"noar":undefined)});
  body.querySelectorAll("[data-ar]").forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.ar.split("-");speak(s.notes[i].ar[j][0],"ar")});
  body.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.v.split("-");const v=s.notes[i].v[j];body.querySelectorAll(".vc.on").forEach(x=>x.classList.remove("on"));b.classList.add("on");speak(v[0],"ar")});
  body.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.g.split("-");speak(s.notes[i].g[j][1].replace("★",""),"noar")});
  body.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.w.split("-");b.classList.add("on");speak(s.notes[i].w[j][1],"noar")});
  document.getElementById("goL").onclick=()=>openSubject(s.id,"latihan");
}

function renderSets(s,body){
  const b=best[s.id]||[];
  body.innerHTML=`<div class="fmt"><b>Format soalan (seperti peperiksaan):</b><br>Bahagian A: Objektif, pilih jawapan A, B, C atau D (soalan 1 hingga 24)<br>Bahagian B: Betul atau Salah (soalan 25 hingga 32)<br>Bahagian C: Isi tempat kosong (soalan 33 hingga 40)</div>
  <div class="sets">${s.sets.map((_,i)=>`<button class="setc" data-set="${i}"><span class="n">Set ${i+1}</span><span class="s">${b[i]!=null?`Markah terbaik: ${b[i]}/40`:"Belum cuba"}</span>${starHtml(starsFor(b[i]))}</button>`).join("")}</div>`;
  body.querySelectorAll("[data-set]").forEach(x=>x.onclick=()=>{sfx.tap();startQuiz(s,+x.dataset.set)});
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(q){
  if(q.length===2)return{q:q[0],sec:"B",lab:"Bahagian B · Betul atau Salah",opts:["Betul","Salah"],ans:q[1]?"Betul":"Salah"};
  const sec=q.length===5?"A":"C";
  return{q:q[0],sec,lab:sec==="A"?"Bahagian A · Objektif":"Bahagian C · Isi tempat kosong",opts:shuffle(q.slice(1)),ans:q[1]};
}

const noTags=x=>String(x).replace(/<[^>]+>/g,"");
function hintFor(sid,it){
  const t=noTags(it.q),ta=t+" "+noTags(it.ans);let h="";
  for(const [re,txt] of (HINTS[sid]||[]))if(re.test(t)||re.test(t.toLowerCase())){h=txt;break}
  if(!h)for(const [re,txt] of (HINTS[sid]||[]))if(re.test(ta)){h=txt;break}
  if(!h)h="Baca soalan perlahan-lahan dan ingat semula nota "+subj(sid).name+".";
  if(it.sec!=="B"){const a=noTags(it.ans).trim();
    if(a&&!AR.test(a)&&!/^\d/.test(a)){const n=a.split(/\s+/).length;h+=` Jawapan bermula dengan huruf “<b>${a[0]}</b>” (${n} perkataan).`}}
  return h;
}

let Q=null;
function startQuiz(s,si){Q={s,si,items:s.sets[si].map(prep),i:0,score:0,picked:[]};drawQ()}
function drawQ(){
  const {s,si,items,i}=Q;const it=items[i];const body=document.getElementById("body");
  const letters="ABCD";
  body.innerHTML=`<div class="quiz">
   <div class="qtop"><span class="chip">${it.lab}</span><span class="qn">Set ${si+1} · Soalan ${i+1}/${items.length}</span></div>
   <div class="bar"><i style="width:${i/items.length*100}%"></i></div>
   <div class="qtext">${wrapAr(it.q.replace(/_{2,}/g,"______"))}</div>
   <div class="opts ${it.opts.length===2?"two":""}">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${it.opts.length===2?(k?"✗":"✓"):letters[k]}</span><span class="v ${AR.test(o)&&!/[a-z]{3}/i.test(o)?"ar":""}">${wrapAr(o)}</span></button>`).join("")}</div>
   <div class="hintbox" id="hintBox" hidden>💡 ${wrapAr(hintFor(s.id,it))}</div>
   <div id="fb"></div>
   <div class="act"><button class="btn ghost" id="hintBtn">💡 Petunjuk</button><button class="btn ghost" id="sayQ">🔊 Dengar soalan</button><button class="btn ghost" id="quit">Berhenti</button></div>
  </div>`;
  document.getElementById("sayQ").onclick=()=>speak(it.q+". "+it.opts.map((o,k)=>(it.opts.length===2?"":letters[k]+". ")+o).join(". "),s.id==="jawi"?"noar":undefined);
  document.getElementById("quit").onclick=()=>openSubject(s.id,"latihan");
  document.getElementById("hintBtn").onclick=()=>{const b=document.getElementById("hintBox");b.hidden=!b.hidden;document.getElementById("hintBtn").textContent=b.hidden?"💡 Petunjuk":"💡 Sorok petunjuk"};
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  scrollTo({top:0,behavior:"smooth"});
}
function answer(k){
  const it=Q.items[Q.i];const pick=it.opts[k];const ok=pick===it.ans;
  Q.picked.push(pick);if(ok)Q.score++;
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(it.opts[j]===it.ans)b.classList.add("ok");else if(j===k)b.classList.add("no")});
  ok?sfx.ok():sfx.no();
  const praise=["Betul! Hebatnya Nadeera! 🎉","Tepat sekali! ⭐","Pandai! Teruskan! 👏","MasyaAllah, betul! 🌟"];
  const fb=document.getElementById("fb");
  fb.innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?praise[Math.floor(Math.random()*praise.length)]:`Tak apa, cuba ingat ya. Jawapan betul: ${wrapAr(it.ans)}`}</div>`;
  const act=document.querySelector(".act");const nx=document.createElement("button");nx.className="btn";nx.textContent=Q.i<Q.items.length-1?"Soalan seterusnya →":"Lihat markah 🏆";act.prepend(nx);nx.focus();
  nx.onclick=()=>{Q.i++;Q.i<Q.items.length?drawQ():finish()};
}
function finish(){
  const {s,si,score,items,picked}=Q;
  best[s.id]=best[s.id]||[];if(best[s.id][si]==null||score>best[s.id][si])best[s.id][si]=score;saveBest();
  const T=items.length;const st=starsFor(score);sfx.win();if(score>=T*.7)confetti();
  const msg=score===T?"Markah penuh! Tahniah Nadeera! 🏆":score>=T*.7?"Bagus sekali! Sikit lagi nak penuh! 💪":score>=T*.5?"Boleh tahan! Baca nota sekali lagi ya. 📖":"Jangan putus asa! Baca nota dan cuba lagi. 🌱";
  document.getElementById("body").innerHTML=`<div class="quiz"><div class="result">
   <span class="chip">${s.name} · Set ${si+1}</span>
   <span class="big">${score}/${T}</span>${starHtml(st)}<h3>${msg}</h3></div>
   <div class="act"><button class="btn" id="again">↻ Cuba lagi</button>${si<4?`<button class="btn ghost" id="next">Set ${si+2} →</button>`:""}<button class="btn ghost" id="notes">📖 Baca nota</button></div>
   <h3>Semak jawapan</h3>
   <div class="review">${items.map((it,i)=>{const ok=picked[i]===it.ans;return `<div class="rv ${ok?"":"no"}"><b>${i+1}. ${ok?"✓":"✗"}</b> ${wrapAr(it.q)}<br>${ok?`Jawapan: ${wrapAr(it.ans)}`:`Jawapan kamu: ${wrapAr(picked[i])} · Betul: <b>${wrapAr(it.ans)}</b>`}</div>`}).join("")}</div></div>`;
  document.getElementById("again").onclick=()=>startQuiz(s,si);
  const n=document.getElementById("next");if(n)n.onclick=()=>startQuiz(s,si+1);
  document.getElementById("notes").onclick=()=>openSubject(s.id,"nota");
  scrollTo({top:0,behavior:"smooth"});
}
home();
</script>
